# Pages CMS Configuration for Cathrine Marchen Asmussen Website

media:
  input: assets/images
  output: /assets/images

content:
  # Videos Collection - Main filmography management
  - name: videos
    label: Documentary Films
    type: collection
    path: content/videos
    filename: '{order}-{slug}.md'
    view:
      fields: [title, title_da, year, duration]
      sort: [order, year, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Title (English)
        type: string
        required: true
      - name: title_da
        label: Title (Danish)
        type: string
        required: true
      - name: year
        label: Year
        type: number
        required: true
      - name: duration
        label: Duration
        type: string
        required: true
        description: e.g., 14 min
      - name: vimeo_url
        label: Vimeo URL
        type: string
        required: true
        description: Full Vimeo URL (e.g., https://vimeo.com/1147617209)
      - name: thumbnail
        label: Thumbnail Image
        type: image
        required: true
      - name: faith
        label: Faith/Category (English)
        type: string
        required: false
      - name: faith_da
        label: Faith/Category (Danish)
        type: string
        required: false
      - name: faith_icon
        label: Faith Icon
        type: image
        required: false
      - name: order
        label: Display Order
        type: number
        required: true
        description: Display order (1 = first)
      - name: description
        label: Description (English)
        type: rich-text
        required: true
      - name: description_da
        label: Description (Danish)
        type: rich-text
        required: true
      - name: filmstriben
        label: Filmstriben Links
        type: string
        list: true
        required: false

  # Portrait
  - name: portrait
    label: Portrait
    type: file
    path: content/portrait.md
    fields:
      - name: title
        label: Title (English)
        type: string
      - name: title_da
        label: Title (Danish)
        type: string
      - name: intro
        label: Introduction (English)
        type: rich-text
        required: false
      - name: intro_da
        label: Introduction (Danish)
        type: rich-text
        required: false
      - name: featured_portrait
        label: Featured Portrait
        type: object
        fields:
          - name: title
            label: Title (English)
            type: string
            required: false
          - name: title_da
            label: Title (Danish)
            type: string
            required: false
          - name: subtitle
            label: Subtitle (English)
            type: string
            required: false
          - name: subtitle_da
            label: Subtitle (Danish)
            type: string
            required: false
          - name: year
            label: Year/Credit
            type: string
            description: e.g., "Eva smith 2025"
          - name: duration
            label: Duration
            type: string
          - name: vimeoId
            label: Vimeo ID
            type: string
          - name: description
            label: Description (English)
            type: text
            required: false
          - name: description_da
            label: Description (Danish)
            type: text
            required: false

  # About
  - name: about
    label: About
    type: file
    path: content/about.md
    fields:
      - name: title
        label: Title (English)
        type: string
      - name: title_da
        label: Title (Danish)
        type: string
      - name: name
        label: Name
        type: string
        required: false
      - name: profession
        label: Profession (English)
        type: string
      - name: profession_da
        label: Profession (Danish)
        type: string
      - name: bio
        label: Biography (English)
        type: rich-text
      - name: bio_da
        label: Biography (Danish)
        type: rich-text
      - name: acknowledgements
        label: Acknowledgements (English)
        type: string
        list: true
      - name: acknowledgements_da
        label: Acknowledgements (Danish)
        type: string
        list: true
      - name: links
        label: Links
        type: object
        fields:
          - name: imdb
            label: IMDb URL
            type: string
          - name: dfi
            label: Danish Film Institute URL
            type: string

  # Site Settings
  - name: site_settings
    label: Site Settings
    type: file
    path: content/site.md
    fields:
      - name: title
        label: Site Title
        type: string
      - name: tagline
        label: Tagline
        type: string
      - name: email
        label: Email
        type: string
      - name: phone
        label: Phone
        type: string
